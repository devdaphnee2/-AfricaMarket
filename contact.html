<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - AfriMarket</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>AfriMarket</h1>
    <nav aria-label="Menu principal">
      <a href="index.html">Accueil</a>
      <a href="produits.html">Produits</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>
  <main>
    <section class="contact" aria-labelledby="titre-contact">
      <h2 id="titre-contact">Nous contacter</h2>
      <form id="form-contact" novalidate>
        <div class="form-group">
          <label for="nom">Nom <span aria-label="obligatoire">*</span> :</label>
          <input type="text" id="nom" name="nom" required aria-required="true">
        </div>
        
        <div class="form-group">
          <label for="email">E-mail <span aria-label="obligatoire">*</span> :</label>
          <input type="email" id="email" name="email" required aria-required="true" aria-describedby="email-help">
          <small id="email-help">Format : exemple@domaine.com</small>
        </div>
        
        <div class="form-group">
          <label for="message">Message <span aria-label="obligatoire">*</span> :</label>
          <textarea id="message" name="message" rows="5" required aria-required="true"></textarea>
        </div>
        
        <button type="submit">Envoyer</button>
      </form>
    </section>
  </main>
  <footer><p>&copy; 2026 AfriMarket - Projet pédagogique</p></footer>
  <script src="js/contact.js"></script>
</body>
</html>
